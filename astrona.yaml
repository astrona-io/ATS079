          - Prove that an Application for production is refused
        resources:
          - name: "Argo CD projects"
            url: https://argo-cd.readthedocs.io/en/stable/user-guide/projects/
      - type: quiz
        title: "Knowledge Check: GitOps Basics and Workflows"
        path: sections/section-040/quiz.yaml
