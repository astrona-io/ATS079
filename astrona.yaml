# Course manifest for ATS079. Each section lists its README, modules (landing, parts, lab Question reading and lab entry, summary), a capstone and a quiz.
training:
  id: ATS079
  title: 'CNPA: Continuous Delivery & Platform Engineering'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and original scenario quizzes
    covering every published objective in this CNPA domain. Labs run on kind (Kubernetes 1.35) and are built untested.
  certification:
    name: Certified Cloud Native Platform Engineering Associate
    code: CNPA
    provider: CNCF / Linux Foundation
    domain: Continuous Delivery & Platform Engineering
    weight: 16
    competencies:
    - Continuous Integration Pipelines Overview
    - Incident Response in Platform Engineering
    - CI/CD Relationship Fundamentals
    - GitOps Basics and Workflows
    - GitOps for Application Environments
modules:
  - id: module-intro
    title: Introduction
    description: Audience, reading method and review process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
