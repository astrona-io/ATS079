      - type: reading
        title: "Question"
        path: sections/section-040/module-01/labs/lab-01/question.md
      - type: lab
        title: "Revert A Bad Release And Make Argo CD Enforce Git Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: gitops
        task_kind: troubleshoot
        tags: [argocd, gitops, revert, selfheal, prune]
        learning_goals:
          - Undo a bad release with a revert commit that keeps the history
          - Verify the delivery from sync and health status at the head commit
          - Turn on prune and selfHeal and prove that a hand edit is undone
        resources:
          - name: "Argo CD automated sync policy"
            url: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
      - type: reading
        title: "Summary"
        path: sections/section-040/module-01/course-04-summary.md
      - type: reading
        title: "Question"
        path: sections/section-040/capstone/labs/lab-01/question.md
      - type: lab
        title: "Policy Boundary Capstone"
        path: sections/section-040/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: gitops
        task_kind: deploy
        tags: [argocd, appproject, policy, destinations]
        learning_goals:
          - Create a project that allows one repository and one destination
