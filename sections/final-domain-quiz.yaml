# Final knowledge check across sections 010 to 050. Listed in astrona.yaml as the last `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats079-final
course_id: ATS079
exam_code: CNPA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: continuous-delivery-and-platform-engineering
  title: "Continuous Delivery & Platform Engineering"
questions:
  - id: ats079-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain acyclic task dependencies and eligible parallelism"
    source_readings:
      - sections/section-010/module-01/course-01-dag-dependencies-conditional-tasks-and-parallel-work.md
    prompt: "Two tasks in a pipeline have no dependency path between them. What follows?"
    options:
      - id: a
        text: "They must run one after the other in file order"
        explanation: "File order does not create a dependency."
      - id: b
        text: "They can run at the same time when the pipeline limits allow it"
        explanation: "Correct. Without a path, neither task has to wait for the other."
      - id: c
        text: "They are in a cycle"
        explanation: "A cycle needs a path back to the start."
      - id: d
        text: "Neither one can run"
        explanation: "Tasks without dependencies are eligible at once."
    correct_option: b
    explanation: "Eligibility comes from the dependency graph."

  - id: ats079-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Distinguish data references from scheduling dependencies"
    source_readings:
      - sections/section-010/module-01/course-03-data-outputs-and-parallelism-limits.md
    prompt: "A task uses the output of another task but does not list it in `depends`. What is the risk?"
    options:
      - id: a
        text: "None, because the reference makes the task wait"
        explanation: "A reference does not make a task wait."
      - id: b
        text: "The consumer can become eligible before the value exists"
        explanation: "Correct. The dependency has to be explicit."
      - id: c
        text: "The producer runs twice"
        explanation: "Nothing runs twice."
      - id: d
        text: "The output is encrypted"
        explanation: "Outputs are not encrypted by a reference."
    correct_option: b
    explanation: "A reference reads a value, and `depends` schedules."

  - id: ats079-final-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish platform incidents from application failures"
    source_readings:
      - sections/section-020/module-01/course-02-mitigation-first-rolling-back-a-bad-release.md
    prompt: "A bad release causes errors in production, and the previous version is known to be good. What does mitigation-first mean here?"
    options:
      - id: a
        text: "Find the root cause before any change"
        explanation: "The cause can wait."
      - id: b
        text: "Restore service by rolling back, and investigate afterwards"
        explanation: "Correct."
      - id: c
        text: "Scale the release to zero and close the incident"
        explanation: "That is not recovery."
      - id: d
        text: "Wait for the next release"
        explanation: "Users are affected now."
    correct_option: b
    explanation: "Mitigation limits the harm first."

  - id: ats079-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reason about recovery evidence"
    source_readings:
      - sections/section-020/module-01/course-03-configuration-faults-crash-loops-and-readiness.md
    prompt: "A Pod restarts in a loop because a required setting is missing. Which evidence shows the cause most directly?"
    options:
      - id: a
        text: "The node CPU graph"
        explanation: "It does not name the missing setting."
      - id: b
        text: "The container log and the previous container state"
        explanation: "Correct. They show why the process exited."
      - id: c
        text: "The Service type"
        explanation: "It is not related."
      - id: d
        text: "The cluster version"
        explanation: "It is not related."
    correct_option: b
    explanation: "Read the failing container, not the surroundings."

  - id: ats079-final-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish continuous integration, delivery and deployment"
    source_readings:
      - sections/section-030/module-01/course-02-git-as-the-handoff-promotion-by-commit.md
    prompt: "What separates continuous delivery from continuous deployment?"
    options:
      - id: a
        text: "Delivery never uses tests"
        explanation: "Both use tests."
      - id: b
        text: "Delivery keeps a human decision before production, and deployment removes it"
        explanation: "Correct."
      - id: c
        text: "Deployment does not use Git"
        explanation: "Both can use Git."
      - id: d
        text: "Delivery runs only in staging"
        explanation: "Delivery can reach production."
    correct_option: b
    explanation: "The difference is the last decision."

  - id: ats079-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Promote by commit"
    source_readings:
      - sections/section-030/module-01/course-02-git-as-the-handoff-promotion-by-commit.md
    prompt: "How does a GitOps team promote a version from staging to production?"
    options:
      - id: a
        text: "It edits the production Deployment with `kubectl`"
        explanation: "Git would not record it."
      - id: b
        text: "It commits the new version to the production overlay and lets the agent deliver it"
        explanation: "Correct."
      - id: c
        text: "It restarts the agent"
        explanation: "That does not change the version."
      - id: d
        text: "It deletes the staging Application"
        explanation: "That does not promote anything."
    correct_option: b
    explanation: "The promotion is a reviewed commit."

  - id: ats079-final-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Read delivery evidence"
    source_readings:
      - sections/section-030/module-01/course-03-observing-delivery-status-revision-and-delivery-records.md
    prompt: "An Application is `Synced` and `Healthy`, but `status.sync.revision` is an older commit than the head of `main`. What is the correct conclusion?"
    options:
      - id: a
        text: "The newest commit is delivered"
        explanation: "The revision names an older commit."
      - id: b
        text: "The newest commit has not been compared yet, so the delivery is not proven"
        explanation: "Correct. Ask for a refresh and read again."
      - id: c
        text: "Git lost the commit"
        explanation: "Git keeps the commit."
      - id: d
        text: "The health status is wrong"
        explanation: "Health describes the objects that were applied."
    correct_option: b
    explanation: "Status and revision are separate evidence."

  - id: ats079-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the sync policy switches"
    source_readings:
      - sections/section-040/module-01/course-02-reconciliation-drift-self-heal-and-prune.md
    prompt: "An Application has `automated: {}`. A file is removed from Git. What happens to the object?"
    options:
      - id: a
        text: "It is deleted at once"
        explanation: "That needs prune."
      - id: b
        text: "It stays and the Application reports OutOfSync"
        explanation: "Correct."
      - id: c
        text: "The commit is refused"
        explanation: "Git accepts it."
      - id: d
        text: "The Application is deleted"
        explanation: "It is not."
    correct_option: b
    explanation: "Prune is a separate switch."

  - id: ats079-final-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Reason about policy and rollback"
    source_readings:
      - sections/section-040/module-01/course-03-policy-boundaries-identity-ownership-and-rollback.md
    prompt: "Which action undoes a bad release and keeps the record of both the release and the repair?"
    options:
      - id: a
        text: "A force-push of a history without the bad commit"
        explanation: "The history then hides what ran."
      - id: b
        text: "A revert commit, pushed and delivered like any change"
        explanation: "Correct."
      - id: c
        text: "Editing the live Deployment"
        explanation: "Git would still hold the bad state."
      - id: d
        text: "Deleting the Application"
        explanation: "That removes the delivery."
    correct_option: b
    explanation: "A rollback adds to the history."

  - id: ats079-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain AppProject restrictions"
    source_readings:
      - sections/section-050/module-01/course-02-environments-projects-and-the-deletion-lifecycle.md
    prompt: "An Application in a project targets a namespace that the project does not list. What happens?"
    options:
      - id: a
        text: "The objects are created with a warning"
        explanation: "Nothing is applied."
      - id: b
        text: "Nothing is applied and the Application shows an InvalidSpecError condition"
        explanation: "Correct."
      - id: c
        text: "The project is extended automatically"
        explanation: "A project is never changed by an Application."
      - id: d
        text: "The Application moves to the default project"
        explanation: "It does not."
    correct_option: b
    explanation: "The project is checked before the write."

  - id: ats079-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Evaluate the deletion lifecycle"
    source_readings:
      - sections/section-050/module-01/course-02-environments-projects-and-the-deletion-lifecycle.md
    prompt: "An Application without the finalizer `resources-finalizer.argocd.argoproj.io` is deleted. What happens to its objects?"
    options:
      - id: a
        text: "They are deleted first"
        explanation: "That needs the finalizer."
      - id: b
        text: "They keep running without an owner"
        explanation: "Correct."
      - id: c
        text: "They are scaled to zero"
        explanation: "Nothing scales them."
      - id: d
        text: "They move to another Application"
        explanation: "Nothing adopts them."
    correct_option: b
    explanation: "The finalizer decides whether the deletion cascades."

  - id: ats079-final-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Generate environments with an ApplicationSet"
    source_readings:
      - sections/section-050/module-01/course-03-applicationsets-generating-environments.md
    prompt: "An element is removed from a list generator and the template carries the finalizer. What is removed?"
    options:
      - id: a
        text: "Only the generated Application"
        explanation: "The finalizer removes the objects too."
      - id: b
        text: "The generated Application and, through the cascade, its objects"
        explanation: "Correct."
      - id: c
        text: "Only the objects"
        explanation: "The Application is deleted as well."
      - id: d
        text: "Nothing until the ApplicationSet is deleted"
        explanation: "The list drives deletion."
    correct_option: b
    explanation: "One list controls the environments."

  - id: ats079-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Evaluate the risk of a shared definition"
    source_readings:
      - sections/section-050/module-01/course-03-applicationsets-generating-environments.md
    prompt: "Why does an ApplicationSet need the same review as a production change?"
    options:
      - id: a
        text: "It is larger than an Application"
        explanation: "Size is not the reason."
      - id: b
        text: "One mistake in the template reaches every generated environment"
        explanation: "Correct."
      - id: c
        text: "It cannot be stored in Git"
        explanation: "It can."
      - id: d
        text: "It runs outside the cluster"
        explanation: "It runs in the cluster."
    correct_option: b
    explanation: "A shared template spreads a mistake."

  - id: ats079-final-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Reason about delivery authority"
    source_readings:
      - sections/section-040/module-01/course-02-reconciliation-drift-self-heal-and-prune.md
      - sections/section-050/module-01/course-02-environments-projects-and-the-deletion-lifecycle.md
    prompt: "A hand edit is made to a delivered Deployment, and the Application has selfHeal on. What does Argo CD do?"
    options:
      - id: a
        text: "It keeps the edit and stays Synced"
        explanation: "The edit differs from Git."
      - id: b
        text: "It reverts the edit to the state in Git"
        explanation: "Correct."
      - id: c
        text: "It commits the edit to Git"
        explanation: "Argo CD never writes to Git."
      - id: d
        text: "It deletes the Application"
        explanation: "It does not."
    correct_option: b
    explanation: "Git is the source of truth."

  - id: ats079-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare conditions and refusals"
    source_readings:
      - sections/section-050/module-01/course-02-environments-projects-and-the-deletion-lifecycle.md
      - sections/section-040/module-01/course-03-policy-boundaries-identity-ownership-and-rollback.md
    prompt: "Where does a project refusal become visible?"
    options:
      - id: a
        text: "In the Git history"
        explanation: "Git is not involved."
      - id: b
        text: "As a condition on the Application"
        explanation: "Correct."
      - id: c
        text: "In the container logs"
        explanation: "No container runs."
      - id: d
        text: "In the node events only"
        explanation: "The condition is on the Application."
    correct_option: b
    explanation: "The Application is the evidence."

  - id: ats079-final-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what deployment means for CI"
    source_readings:
      - sections/section-010/module-02/course-01-pipeline-stages-and-what-each-one-proves.md
    prompt: "Which statement about deployment is correct for a CI pipeline?"
    options:
      - id: a
        text: "Deploying is a normal CI stage"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Deploying starts from the artifact that the pipeline published and belongs to delivery"
        explanation: "Correct. The CI pipeline ends with a published artifact. Delivery uses it."
      - id: c
        text: "Deploying must run before tests"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Deploying replaces the package stage"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "The CI pipeline ends with a published artifact. Delivery uses it."

  - id: ats079-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use volumeClaimTemplates"
    source_readings:
      - sections/section-010/module-02/course-02-sharing-files-between-tasks-with-a-workspace.md
    prompt: "What does volumeClaimTemplates on a workflow do?"
    options:
      - id: a
        text: "It creates a PersistentVolumeClaim for each run and deletes it when the run ends"
        explanation: "Correct. Each run gets its own volume, so runs do not overwrite each other."
      - id: b
        text: "It shares one permanent volume between all runs"
        explanation: "This does not match the behavior described in the reading."
      - id: c
        text: "It installs a storage class"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "It copies files to an object store"
        explanation: "This does not match the behavior described in the reading."
    correct_option: a
    explanation: "Each run gets its own volume, so runs do not overwrite each other."

  - id: ats079-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read logs of a restarted container"
    source_readings:
      - sections/section-020/module-02/course-01-signals-metrics-logs-events-and-traces.md
    prompt: "A container restarted and you need the log of the run that failed. Which option do you add to kubectl logs?"
    options:
      - id: a
        text: "--previous"
        explanation: "Correct. --previous prints the log of the earlier container run."
      - id: b
        text: "--follow"
        explanation: "This does not match the behavior described in the reading."
      - id: c
        text: "--all-containers"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "--timestamps"
        explanation: "This does not match the behavior described in the reading."
    correct_option: a
    explanation: "--previous prints the log of the earlier container run."

  - id: ats079-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a duration"
    source_readings:
      - sections/section-020/module-02/course-02-symptoms-causes-and-actionable-alerts.md
    prompt: "Why does an alert rule include a duration such as five minutes?"
    options:
      - id: a
        text: "To make the alert louder"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "To avoid alerts for conditions that last only seconds"
        explanation: "Correct. A short blip is not an incident."
      - id: c
        text: "To store the metric longer"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "To change the severity"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "A short blip is not an incident."

  - id: ats079-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set rolling update fields"
    source_readings:
      - sections/section-030/module-02/course-01-recreate-and-rolling-update.md
    prompt: "A Deployment has maxSurge 1 and maxUnavailable 0. What happens during an update?"
    options:
      - id: a
        text: "Old pods stop first"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "A new pod starts and must be ready before an old pod stops"
        explanation: "Correct. With maxUnavailable 0 the Deployment never goes below the wanted ready count."
      - id: c
        text: "All pods are replaced at once"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "The update is rejected"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "With maxUnavailable 0 the Deployment never goes below the wanted ready count."

  - id: ats079-final-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the cost"
    source_readings:
      - sections/section-030/module-02/course-02-blue-green-with-a-service-selector.md
    prompt: "Which cost belongs to blue/green delivery?"
    options:
      - id: a
        text: "It needs double capacity while both environments run"
        explanation: "Correct. Both complete environments run during the change."
      - id: b
        text: "It cannot be reversed"
        explanation: "This does not match the behavior described in the reading."
      - id: c
        text: "It needs a service mesh"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "It always causes downtime"
        explanation: "This does not match the behavior described in the reading."
    correct_option: a
    explanation: "Both complete environments run during the change."

  - id: ats079-final-q22
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate code and configuration"
    source_readings:
      - sections/section-040/module-02/course-01-repository-layout-and-rendering-with-kustomize.md
    prompt: "Why keep application code and deployment configuration in different repositories?"
    options:
      - id: a
        text: "Git cannot store YAML next to code"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "A pipeline that pushes to its own trigger repository can loop, and access can differ"
        explanation: "Correct. Separate repositories avoid pipeline loops and allow stricter rules for production."
      - id: c
        text: "Kustomize only reads empty repositories"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Argo CD cannot read code repositories"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "Separate repositories avoid pipeline loops and allow stricter rules for production."

  - id: ats079-final-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Failed hook"
    source_readings:
      - sections/section-040/module-02/course-02-sync-waves-and-hooks.md
    prompt: "A PreSync hook Job fails. What does Argo CD do?"
    options:
      - id: a
        text: "Applies the manifests anyway"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Stops the sync, so the Deployment is not touched"
        explanation: "Correct. A failed PreSync hook stops the sync."
      - id: c
        text: "Deletes the Application"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Retries with a higher wave"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "A failed PreSync hook stops the sync."

  - id: ats079-final-q24
    type: single_choice
    difficulty: beginner
    learning_objective: "Pick a generator"
    source_readings:
      - sections/section-050/module-02/course-01-choosing-an-applicationset-generator.md
    prompt: "Which generator creates a preview environment for each open pull request?"
    options:
      - id: a
        text: "List"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Cluster"
        explanation: "This does not match the behavior described in the reading."
      - id: c
        text: "Pull request"
        explanation: "Correct. The pull request generator ties an environment to an open request."
      - id: d
        text: "Git file"
        explanation: "This does not match the behavior described in the reading."
    correct_option: c
    explanation: "The pull request generator ties an environment to an open request."

  - id: ats079-final-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Removed folder"
    source_readings:
      - sections/section-050/module-02/course-02-the-git-directory-generator-and-combined-generators.md
    prompt: "A folder disappears from the repository. What does the ApplicationSet controller do?"
    options:
      - id: a
        text: "Keeps the Application unchanged"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Deletes the Application that it created for the folder"
        explanation: "Correct. The parameter set disappears, so the Application is deleted."
      - id: c
        text: "Moves the Application to another project"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Sets the Application to OutOfSync only"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "The parameter set disappears, so the Application is deleted."
