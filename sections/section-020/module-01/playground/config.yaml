# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Incident Roles, Evidence And Platform Recovery (PLAYGROUND). Healthy scout with two replicas.
# No task, no grading. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-079-playground-020-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
