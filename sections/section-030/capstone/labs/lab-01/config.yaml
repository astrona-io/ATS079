# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Delivery Contract Capstone (LAB). Promote staging, then production, and record both. Graded against Git and the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-079-lab-030-capstone
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares the starting state"
      type: file
      source: bootstrap/03-seed.sh
    - name: configure-argocd
      description: "Gives Argo CD the repository credentials and creates the starting Applications"
      type: file
      source: bootstrap/04-configure-argocd.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: promotion-order
      description: "Both overlays name 6.15.0, each in its own commit, and the production commit is newer than the staging commit"
      type: file
      source: validation/validate-promotion-order.sh
      hint: "Make two commits: staging first, production second. Each commit changes one overlay."
    - name: both-delivered
      description: "Both Applications are Synced and Healthy at the head commit and run 6.15.0; production has two ready replicas"
      type: file
      source: validation/validate-both-delivered.sh
      hint: "Refresh both Applications with the annotation argocd.argoproj.io/refresh=hard and wait for each rollout."
    - name: delivery-record
      description: "delivery-record holds the staging commit, the production commit and the version"
      type: file
      source: validation/validate-delivery-record.sh
      hint: "Use the commit that changed each overlay, not the head commit. Keys: staging-commit, production-commit, version."

teardown:
  keepCluster: false
