# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Promote Staging By Commit And Record The Delivery (LAB). Graded against Git and the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-079-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares the starting state"
      type: file
      source: bootstrap/03-seed.sh
    - name: configure-argocd
      description: "Gives Argo CD the repository credentials and creates the starting Application"
      type: file
      source: bootstrap/04-configure-argocd.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: promoted-in-git
      description: "The staging overlay in Git names 6.15.0 and the change is a new commit"
      type: file
      source: validation/validate-promoted-in-git.sh
      hint: "Edit overlays/staging/kustomization.yaml in the repository, commit and push to main. Do not edit objects in the cluster."
    - name: delivered-by-argocd
      description: "scout-staging is Synced and Healthy at the head commit, and Argo CD owns the Deployment, which runs 6.15.0"
      type: file
      source: validation/validate-delivered-by-argocd.sh
      hint: "Ask Argo CD to refresh with the annotation argocd.argoproj.io/refresh=hard, then wait for the rollout."
    - name: delivery-record
      description: "delivery-record has environment, version, the full head commit and health"
      type: file
      source: validation/validate-delivery-record.sh
      hint: "Read the commit from .status.sync.revision of the Application. Keys: environment, version, commit, health."

teardown:
  keepCluster: false
