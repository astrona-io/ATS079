# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Policy Boundary Capstone (LAB). Put staging in a project and prove that production is refused. Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-079-lab-040-capstone
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares the starting state"
      type: file
      source: bootstrap/03-seed.sh
    - name: configure-argocd
      description: "Gives Argo CD the repository credentials and creates the starting Application"
      type: file
      source: bootstrap/04-configure-argocd.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: project-boundary
      description: "The project scout-team allows only the repository and the namespace starfleet-staging"
      type: file
      source: validation/validate-project-boundary.sh
      hint: "Set sourceRepos to the one repository URL and destinations to the in-cluster server with the namespace starfleet-staging. No wildcards."
    - name: staging-in-project
      description: "scout-staging belongs to scout-team and is Synced and Healthy"
      type: file
      source: validation/validate-staging-in-project.sh
      hint: "Patch spec.project of scout-staging. The project must allow its repository and destination first."
    - name: production-refused
      description: "scout-production-attempt is refused with InvalidSpecError and creates nothing in starfleet-production"
      type: file
      source: validation/validate-production-refused.sh
      hint: "Create the Application in the project scout-team with the path overlays/production and the destination namespace starfleet-production."

teardown:
  keepCluster: false
