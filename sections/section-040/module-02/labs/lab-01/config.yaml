# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Add A PreSync Hook Through Git (LAB). Graded against Git and the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-079-lab-040-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares the starting state"
      type: file
      source: bootstrap/03-seed.sh
    - name: configure-argocd
      description: "Gives Argo CD the repository credentials and creates the starting Application"
      type: file
      source: bootstrap/04-configure-argocd.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: hook-in-git
      description: "Git holds a PreSync hook Job with a delete policy and the staging overlay lists it"
      type: file
      source: validation/validate-hook-in-git.sh
      hint: "Add the annotation argocd.argoproj.io/hook: PreSync to the Job and list the file under resources in overlays/staging/kustomization.yaml."
    - name: hook-ran
      description: "The last sync ran the hook Job in the PreSync phase and it Succeeded"
      type: file
      source: validation/validate-hook-ran.sh
      hint: "Ask Argo CD to refresh with the annotation argocd.argoproj.io/refresh=hard and read .status.operationState.syncResult.resources."
    - name: delivered
      description: "scout-staging is Synced and Healthy at the head commit and still runs 6.14.0 with one replica"
      type: file
      source: validation/validate-delivered.sh
      hint: "The hook must not change the image tag or the replica count."

teardown:
  keepCluster: false
