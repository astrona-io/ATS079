# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Application Source, Destination And Project Boundaries (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-079-lab-050-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares the starting state"
      type: file
      source: bootstrap/03-seed.sh
    - name: configure-argocd
      description: "Gives Argo CD the repository credentials. No project and no Application exist yet"
      type: file
      source: bootstrap/04-configure-argocd.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: project-boundary
      description: "The project scout-team allows only the repository and the staging and production namespaces"
      type: file
      source: validation/validate-project-boundary.sh
      hint: "Set sourceRepos to the one repository URL and destinations to the in-cluster server with the namespaces starfleet-staging and starfleet-production. No wildcards."
    - name: applications-delivered
      description: "Both Applications are in scout-team, Synced and Healthy at the head commit and tracked; only production has the finalizer"
      type: file
      source: validation/validate-applications-delivered.sh
      hint: "Create scout-staging without a finalizer and scout-production with resources-finalizer.argocd.argoproj.io, both with the project scout-team."
    - name: preview-refused
      description: "A temporary Application for starfleet-preview in scout-team is refused with InvalidSpecError"
      type: file
      source: validation/validate-preview-refused.sh
      hint: "Do not list starfleet-preview in the destinations of the project."

teardown:
  keepCluster: false
