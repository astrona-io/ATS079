# Knowledge check for module 02 of section 050. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats079-050-m02
course_id: ATS079
exam_code: CNPA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-050/module-02
  title: "ApplicationSet Generators, Project Policy And Promotion"
questions:
  - id: ats079-050-m02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the parts"
    source_readings:
      - sections/section-050/module-02/course-01-choosing-an-applicationset-generator.md
    prompt: "What are the two parts of an ApplicationSet?"
    options:
      - id: a
        text: "A source and a destination"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "A generator and a template"
        explanation: "Correct. The generator produces parameter sets and the template is filled for each."
      - id: c
        text: "A project and a role"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "A hook and a wave"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "The generator produces parameter sets and the template is filled for each."

  - id: ats079-050-m02-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Pick a generator"
    source_readings:
      - sections/section-050/module-02/course-01-choosing-an-applicationset-generator.md
    prompt: "Which generator creates a preview environment for each open pull request?"
    options:
      - id: a
        text: "List"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Cluster"
        explanation: "This does not match the behavior described in the reading."
      - id: c
        text: "Pull request"
        explanation: "Correct. The pull request generator ties an environment to an open request."
      - id: d
        text: "Git file"
        explanation: "This does not match the behavior described in the reading."
    correct_option: c
    explanation: "The pull request generator ties an environment to an open request."

  - id: ats079-050-m02-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Catch a misspelled key"
    source_readings:
      - sections/section-050/module-02/course-01-choosing-an-applicationset-generator.md
    prompt: "Which option makes a misspelled template key fail instead of rendering an empty value?"
    options:
      - id: a
        text: "goTemplateOptions with missingkey=error"
        explanation: "Correct. missingkey=error makes the template fail on an unknown key."
      - id: b
        text: "preserveResourcesOnDeletion"
        explanation: "This does not match the behavior described in the reading."
      - id: c
        text: "syncPolicy.automated"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "exclude: true"
        explanation: "This does not match the behavior described in the reading."
    correct_option: a
    explanation: "missingkey=error makes the template fail on an unknown key."

  - id: ats079-050-m02-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Exclude a folder"
    source_readings:
      - sections/section-050/module-02/course-02-the-git-directory-generator-and-combined-generators.md
    prompt: "How do you remove overlays/preview from the matches of a Git directory generator?"
    options:
      - id: a
        text: "Delete it from the template"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Add a directories entry with the path and exclude: true"
        explanation: "Correct. An entry with exclude: true removes the folder from the matches."
      - id: c
        text: "Set revision to preview"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Add a finalizer"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "An entry with exclude: true removes the folder from the matches."

  - id: ats079-050-m02-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Read a path variable"
    source_readings:
      - sections/section-050/module-02/course-02-the-git-directory-generator-and-combined-generators.md
    prompt: "For the folder overlays/staging, what does .path.basename hold?"
    options:
      - id: a
        text: "overlays/staging"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "overlays"
        explanation: "This does not match the behavior described in the reading."
      - id: c
        text: "staging"
        explanation: "Correct. basename is the last element of the path."
      - id: d
        text: "main"
        explanation: "This does not match the behavior described in the reading."
    correct_option: c
    explanation: "basename is the last element of the path."

  - id: ats079-050-m02-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Removed folder"
    source_readings:
      - sections/section-050/module-02/course-02-the-git-directory-generator-and-combined-generators.md
    prompt: "A folder disappears from the repository. What does the ApplicationSet controller do?"
    options:
      - id: a
        text: "Keeps the Application unchanged"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Deletes the Application that it created for the folder"
        explanation: "Correct. The parameter set disappears, so the Application is deleted."
      - id: c
        text: "Moves the Application to another project"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Sets the Application to OutOfSync only"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "The parameter set disappears, so the Application is deleted."

  - id: ats079-050-m02-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Combine generators"
    source_readings:
      - sections/section-050/module-02/course-02-the-git-directory-generator-and-combined-generators.md
    prompt: "A Git directory generator with 3 folders is combined with a cluster generator with 2 clusters in a matrix. How many Applications result?"
    options:
      - id: a
        text: "5"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "6"
        explanation: "Correct. A matrix produces every pair, so 3 times 2."
      - id: c
        text: "3"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "2"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "A matrix produces every pair, so 3 times 2."

  - id: ats079-050-m02-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Sync windows"
    source_readings:
      - sections/section-050/module-02/course-03-project-roles-sync-windows-and-orphaned-resources.md
    prompt: "A deny window and an allow window both match an Application at the same time. What applies?"
    options:
      - id: a
        text: "The allow window"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "The deny window"
        explanation: "Correct. A deny window wins over an allow window."
      - id: c
        text: "The newer window"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Neither, the sync runs"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "A deny window wins over an allow window."

  - id: ats079-050-m02-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Orphaned resources"
    source_readings:
      - sections/section-050/module-02/course-03-project-roles-sync-windows-and-orphaned-resources.md
    prompt: "What does orphanedResources with warn: true do?"
    options:
      - id: a
        text: "Deletes unowned objects"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Shows a condition for unowned objects and changes nothing else"
        explanation: "Correct. Argo CD only reports orphans and never deletes them."
      - id: c
        text: "Blocks all syncs"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Adds a finalizer"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "Argo CD only reports orphans and never deletes them."

  - id: ats079-050-m02-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Gate a promotion"
    source_readings:
      - sections/section-050/module-02/course-04-promotion-between-environments.md
    prompt: "Which arrangement is a gated promotion?"
    options:
      - id: a
        text: "One commit changes staging and production"
        explanation: "This does not match the behavior described in the reading."
      - id: b
        text: "Production changes only after staging is delivered and its checks passed"
        explanation: "Correct. The gate means production changes only after staging proved the same version."
      - id: c
        text: "Both environments use the latest tag"
        explanation: "This does not match the behavior described in the reading."
      - id: d
        text: "Production is edited by hand"
        explanation: "This does not match the behavior described in the reading."
    correct_option: b
    explanation: "The gate means production changes only after staging proved the same version."
